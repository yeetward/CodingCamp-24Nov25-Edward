<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Todo App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Minimal custom CSS just for animations */
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <!-- Login Card -->
    <div class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- Header Section -->
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-8 text-center">
            <div class="w-20 h-20 mx-auto mb-4 bg-white rounded-full flex items-center justify-center">
                <span class="text-3xl">📝</span>
            </div>
            <h1 class="text-3xl font-bold text-white">Todo App</h1>
            <p class="text-blue-100 mt-2">Sign in to manage your tasks</p>
        </div>
        
        <!-- Form Section -->
        <div class="p-8">
            <form id="login-form" class="space-y-6">
                <!-- Email Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email"
                        placeholder="admin123@gmail.com"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
                    >
                </div>
                
                <!-- Password Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="password"
                        placeholder="admin123"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
                    >
                </div>
                
                <!-- Test Credentials Card -->
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <p class="text-sm font-medium text-blue-800 mb-2">Test Account (click to auto-fill):</p>
                    <div class="space-y-1">
                        <p class="text-sm text-blue-700">
                            <span class="font-mono cursor-pointer hover:underline" onclick="autoFill()">
                                admin123@gmail.com
                            </span>
                        </p>
                        <p class="text-sm text-blue-700">
                            <span class="font-mono cursor-pointer hover:underline" onclick="autoFill()">
                                admin123
                            </span>
                        </p>
                    </div>
                </div>
                
                <!-- Error Message -->
                <div id="error-message" class="hidden"></div>
                
                <!-- Login Button -->
                <button 
                    type="submit"
                    id="login-btn"
                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-blue-700 hover:to-purple-700 active:scale-95 transition-all duration-200 shadow-md"
                >
                    Sign In
                </button>
                
                
            </form>
        </div>
        
        <!-- Footer -->
        <div class="bg-gray-50 px-8 py-4 text-center border-t border-gray-200">
            <p class="text-sm text-gray-500">&copy; 2025 Todo App. AWS Powered.</p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
