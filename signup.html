<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Todo App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <!-- Sign Up Card -->
    <div class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- Header Section -->
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-8 text-center">
            <div class="w-20 h-20 mx-auto mb-4 bg-white rounded-full flex items-center justify-center">
                <span class="text-3xl">📝</span>
            </div>
            <h1 class="text-3xl font-bold text-white">Todo App</h1>
            <p class="text-blue-100 mt-2">Create your account</p>
        </div>
        
        <!-- Form Section -->
        <div class="p-8">
            <form id="signup-form" class="space-y-6">
                <!-- Email Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email"
                        placeholder="your.email@example.com"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
                    >
                </div>
                
                <!-- Password Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="password"
                        placeholder="At least 6 characters"
                        required
                        minlength="6"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
                    >
                    <p class="text-xs text-gray-500 mt-1">Minimum 6 characters</p>
                </div>
                
                <!-- Confirm Password Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Confirm Password
                    </label>
                    <input 
                        type="password" 
                        id="confirmPassword"
                        placeholder="Type your password again"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
                    >
                </div>
                
                <!-- Password Requirements Card -->
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <p class="text-sm font-medium text-blue-800 mb-2">Password Requirements:</p>
                    <ul class="text-sm text-blue-700 space-y-1">
                        <li class="flex items-center">
                            <span class="mr-2">✓</span>
                            At least 6 characters
                        </li>
                        <li class="flex items-center">
                            <span class="mr-2">✓</span>
                            Use letters and numbers
                        </li>
                        <li class="flex items-center">
                            <span class="mr-2">✓</span>
                            Case sensitive
                        </li>
                    </ul>
                </div>
                
                <!-- Error/Success Message -->
                <div id="message" class="hidden"></div>
                
                <!-- Sign Up Button -->
                <button 
                    type="submit"
                    id="signup-btn"
                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-blue-700 hover:to-purple-700 active:scale-95 transition-all duration-200 shadow-md"
                >
                    Create Account
                </button>

                <p class="text-center text-sm mt-4">
                    Already have an account? 
                    <a href="login.html" class="text-blue-600 hover:underline">Sign in here</a>
                </p>
            </form>
        </div>
        
        <!-- Footer -->
        <div class="bg-gray-50 px-8 py-4 text-center border-t border-gray-200">
            <p class="text-sm text-gray-500">&copy; 2025 Todo App. AWS Powered.</p>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1000.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@5.2.10/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    <script src="cognito-auth.js"></script>
    <script src="signup.js"></script>
</body>
</html>
